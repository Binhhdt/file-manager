name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tao khung Android
        run: |
          mkdir -p /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=android --org com.fmdemo --project-name file_manager .
          rm -rf lib test
          cp -r /tmp/keep/lib . && cp /tmp/keep/pubspec.yaml .
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/><application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="Quản lý tập tin"#' $M
          cat $M
      - name: Ma Android goc va icon ung dung
        run: |
          K=$(find android/app/src/main -name MainActivity.kt)
          cat > "$K" <<'EOF'
          package com.fmdemo.file_manager

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.pdf.PdfRenderer
          import android.media.MediaMetadataRetriever
          import android.media.ThumbnailUtils
          import android.os.Build
          import android.content.Context
          import android.os.ParcelFileDescriptor
          import android.os.storage.StorageManager
          import android.provider.MediaStore
          import android.util.Size
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : FlutterActivity() {
              private fun saveJpeg(bmp: Bitmap, dest: String) {
                  FileOutputStream(File(dest)).use { bmp.compress(Bitmap.CompressFormat.JPEG, 82, it) }
              }

              private fun work(method: String, src: String, dest: String): Any {
                  when (method) {
                      "apkIcon" -> {
                          val ai = packageManager.getPackageArchiveInfo(src, 0)?.applicationInfo ?: return false
                          ai.sourceDir = src
                          ai.publicSourceDir = src
                          val d = ai.loadIcon(packageManager)
                          val bmp = Bitmap.createBitmap(144, 144, Bitmap.Config.ARGB_8888)
                          d.setBounds(0, 0, 144, 144)
                          d.draw(Canvas(bmp))
                          FileOutputStream(File(dest)).use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                          return true
                      }
                      "videoThumb" -> {
                          @Suppress("DEPRECATION")
                          val bmp: Bitmap? = if (Build.VERSION.SDK_INT >= 29)
                              ThumbnailUtils.createVideoThumbnail(File(src), Size(320, 320), null)
                          else
                              ThumbnailUtils.createVideoThumbnail(src, MediaStore.Video.Thumbnails.MINI_KIND)
                          if (bmp == null) return false
                          saveJpeg(bmp, dest)
                          return true
                      }
                      "pdfThumb" -> {
                          val fd = ParcelFileDescriptor.open(File(src), ParcelFileDescriptor.MODE_READ_ONLY)
                          val r = PdfRenderer(fd)
                          try {
                              val page = r.openPage(0)
                              val w = 320
                              val h = (w.toFloat() * page.height / page.width).toInt().coerceIn(1, 1200)
                              val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                              bmp.eraseColor(Color.WHITE)
                              page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                              page.close()
                              saveJpeg(bmp, dest)
                          } finally {
                              r.close()
                              fd.close()
                          }
                          return true
                      }
                      "audioArt" -> {
                          val mmr = MediaMetadataRetriever()
                          try {
                              mmr.setDataSource(src)
                              val pic = mmr.embeddedPicture ?: return false
                              File(dest).writeBytes(pic)
                              return true
                          } finally {
                              mmr.release()
                          }
                      }
                      "duration" -> {
                          val mmr = MediaMetadataRetriever()
                          try {
                              mmr.setDataSource(src)
                              return mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                          } finally {
                              mmr.release()
                          }
                      }
                  }
                  return false
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "fm/native").setMethodCallHandler { call, result ->
                      val method = call.method
                  if (method == "volumes") {
                      val out = ArrayList<Map<String, String>>()
                      try {
                          if (Build.VERSION.SDK_INT >= 30) {
                              val sm = this@MainActivity.getSystemService(Context.STORAGE_SERVICE) as StorageManager
                              for (v in sm.storageVolumes) {
                                  if (v.isPrimary) continue
                                  val d = v.directory ?: continue
                                  out.add(mapOf("path" to d.absolutePath, "label" to (v.getDescription(this@MainActivity) ?: d.name)))
                              }
                          }
                          if (out.isEmpty()) {
                              for (f in this@MainActivity.getExternalFilesDirs(null)) {
                                  if (f == null) continue
                                  val full = f.absolutePath
                                  val i = full.indexOf("/Android/")
                                  if (i <= 0) continue
                                  val root = full.substring(0, i)
                                  if (root.startsWith("/storage/emulated")) continue
                                  out.add(mapOf("path" to root, "label" to File(root).name))
                              }
                          }
                      } catch (e: Throwable) {
                      }
                      result.success(out)
                      return@setMethodCallHandler
                  }
                      val src = call.argument<String>("src")
                      val dest = call.argument<String>("dest")
                      val known = setOf("apkIcon", "videoThumb", "pdfThumb", "audioArt", "duration")
                      if (src == null || dest == null || !known.contains(method)) {
                          result.notImplemented()
                      } else {
                          Thread {
                              val res: Any = try {
                                  work(method, src, dest)
                              } catch (e: Throwable) {
                                  if (method == "duration") 0L else false
                              }
                              runOnUiThread { result.success(res) }
                          }.start()
                      }
                  }
              }
          }
          EOF
          R=android/app/src/main/res
          mkdir -p $R/mipmap-anydpi-v26 $R/drawable
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_fm_bg"/>
              <foreground android:drawable="@drawable/ic_fm_fg"/>
          </adaptive-icon>
          EOF
          cat > $R/drawable/ic_fm_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2F6FE0" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat > $R/drawable/ic_fm_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#F2A300" android:pathData="M30,36h17l6,6h25a4,4 0,0 1,4 4v26a4,4 0,0 1,-4 4H30a4,4 0,0 1,-4 -4V40a4,4 0,0 1,4 -4z"/>
              <path android:fillColor="#FFD24A" android:pathData="M30,48h48a4,4 0,0 1,4 4v20a4,4 0,0 1,-4 4H30a4,4 0,0 1,-4 -4V52a4,4 0,0 1,4 -4z"/>
              <group android:translateX="15.5" android:translateY="18">
                  <path android:fillColor="#2F6FE0" android:pathData="M28,34h5v20h-5v-13.5l-4,2.5v-5z"/>
                  <path android:fillColor="#2F6FE0" android:fillType="evenOdd" android:pathData="M45,34h5v12h3v4.5h-3v3.5h-5v-3.5h-10v-4z M45,40.5v5.5h-4.6z"/>
              </group>
          </vector>
          EOF
      - name: Build APK
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build.log
          flutter build apk --release 2>&1 | tee -a build.log
      - name: Tom tat loi
        if: failure()
        run: |
          touch build.log
          {
            echo '### Loi build'
            echo '```'
            grep -n -i -E "error|FAILURE|What went wrong|Exception|version solving" -A 6 build.log | head -n 120 || true
            echo '----- 60 dong cuoi -----'
            tail -n 60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
