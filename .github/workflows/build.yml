name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      android_media_smoke:
        description: Kiem thu media tren Android Emulator sau khi build
        type: boolean
        default: false
      android_toolkit_smoke:
        description: Kiem thu tap tin nen va PDF tren Android Emulator
        type: boolean
        default: false
      media_smoke_apk_run:
        description: Run ID cua APK da build de chay lai kiem thu
        type: string
        default: ''

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.media_smoke_apk_run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Chon main.dart moi nhat
        run: |
          # Neu main.dart bi tai nham len thu muc goc va moi hon ban trong lib thi dung ban do.
          mkdir -p lib
          USED=lib/main.dart
          if [ -f main.dart ]; then
            A=$(git log -1 --format=%ct -- main.dart)
            B=$(git log -1 --format=%ct -- lib/main.dart)
            if [ ! -f lib/main.dart ] || [ "${A:-0}" -gt "${B:-0}" ]; then
              cp main.dart lib/main.dart
              USED="main.dart o thu muc goc (moi hon ban trong lib)"
            fi
          fi
          V=$(grep -oP "const appVersion = '\K[^']+" lib/main.dart || true)
          echo "APP_VERSION=${V:-1.0.0}" >> "$GITHUB_ENV"
          {
            echo "### Phien ban ${V:-1.0.0} (ban dung ${{ github.run_number }})"
            echo "Dung tap tin: $USED"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android Lint in the generated Gradle project uses Java 21 APIs.
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tao khung Android
        run: |
          mkdir -p /tmp/keep && cp -r lib test pubspec.yaml /tmp/keep/
          flutter create --platforms=android --org com.fmdemo --project-name file_manager .
          rm -rf lib test
          cp -r /tmp/keep/lib /tmp/keep/test . && cp /tmp/keep/pubspec.yaml .
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/><application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="Quản lý tập tin"#' $M
          python3 android_src/configure_media.py
          python3 android_src/configure_vault.py
          mkdir -p android/app/src/main/assets/notices
          cp android_src/licenses/*.txt android/app/src/main/assets/notices/
          cat >> android/app/build.gradle.kts <<'EOF'
          android {
              compileOptions.isCoreLibraryDesugaringEnabled = true
              packaging.resources.merges += setOf("META-INF/LICENSE.txt", "META-INF/NOTICE.txt")
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.1.5")
              implementation("me.zhanghai.android.libarchive:library:1.1.6")
              implementation("org.apache.commons:commons-compress:1.28.0")
              implementation("org.tukaani:xz:1.12")
          }
          EOF
          cat $M
      - name: Ma Android goc va icon ung dung
        run: |
          K=$(find android/app/src/main -name MainActivity.kt)
          cp android_src/StorageBridge.kt android_src/ArchiveBridge.kt android_src/MediaBridge.kt android_src/MediaPlaybackService.kt "$(dirname "$K")/"
          cat > "$K" <<'EOF'
          package com.fmdemo.file_manager

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.ImageDecoder
          import android.graphics.Color
          import android.graphics.pdf.PdfRenderer
          import android.media.MediaMetadataRetriever
          import android.media.ThumbnailUtils
          import android.os.Build
          import android.content.Intent
          import android.content.res.Configuration
          import androidx.media3.common.util.UnstableApi
          import android.os.ParcelFileDescriptor
          import android.provider.MediaStore
          import android.util.Size
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          @UnstableApi
          class MainActivity : FlutterActivity() {
              private var storage: StorageBridge? = null
              private var archives: ArchiveBridge? = null
              private var media: MediaBridge? = null

              override fun onStart() {
                  super.onStart()
                  media?.activityVisible(true)
              }

              override fun onStop() {
                  media?.activityVisible(false)
                  super.onStop()
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  media?.newIntent(intent)
              }

              override fun onPictureInPictureModeChanged(inPip: Boolean, config: Configuration) {
                  super.onPictureInPictureModeChanged(inPip, config)
                  media?.pipChanged(inPip)
              }


              override fun cleanUpFlutterEngine(flutterEngine: FlutterEngine) {
                  media?.close()
                  media = null
                  archives?.close()
                  archives = null
                  storage?.close()
                  storage = null
                  super.cleanUpFlutterEngine(flutterEngine)
              }

              @Deprecated("Android delivers document tree picker results through this callback")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (storage?.onActivityResult(requestCode, resultCode, data) == true) return
                  super.onActivityResult(requestCode, resultCode, data)
              }

              private fun saveJpeg(bmp: Bitmap, dest: String) {
                  FileOutputStream(File(dest)).use { bmp.compress(Bitmap.CompressFormat.JPEG, 82, it) }
              }

              private fun work(method: String, src: String, dest: String): Any {
                  when (method) {
                      "apkIcon" -> {
                          val ai = packageManager.getPackageArchiveInfo(src, 0)?.applicationInfo ?: return false
                          ai.sourceDir = src
                          ai.publicSourceDir = src
                          val d = ai.loadIcon(packageManager)
                          val bmp = Bitmap.createBitmap(144, 144, Bitmap.Config.ARGB_8888)
                          d.setBounds(0, 0, 144, 144)
                          d.draw(Canvas(bmp))
                          FileOutputStream(File(dest)).use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                          return true
                      }
                      "imageThumb" -> {
                          if (Build.VERSION.SDK_INT < 28) return false
                          val source = ImageDecoder.createSource(File(src))
                          val bmp = ImageDecoder.decodeBitmap(source) { decoder, info, _ ->
                              decoder.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                              val w = info.size.width
                              val h = info.size.height
                              val max = maxOf(w, h)
                              if (max > 384) decoder.setTargetSize(
                                  (w.toLong() * 384 / max).toInt().coerceAtLeast(1),
                                  (h.toLong() * 384 / max).toInt().coerceAtLeast(1)
                              )
                          }
                          try {
                              return FileOutputStream(File(dest)).use {
                                  bmp.compress(Bitmap.CompressFormat.PNG, 100, it)
                              }
                          } finally {
                              bmp.recycle()
                          }
                      }
                      "documentThumb", "documentDuration" ->
                          return storage?.preview(method, src, dest) ?: false
                      "videoThumb" -> {
                          @Suppress("DEPRECATION")
                          val bmp: Bitmap? = if (Build.VERSION.SDK_INT >= 29)
                              ThumbnailUtils.createVideoThumbnail(File(src), Size(320, 320), null)
                          else
                              ThumbnailUtils.createVideoThumbnail(src, MediaStore.Video.Thumbnails.MINI_KIND)
                          if (bmp == null) return false
                          saveJpeg(bmp, dest)
                          return true
                      }
                      "pdfThumb" -> {
                          val fd = ParcelFileDescriptor.open(File(src), ParcelFileDescriptor.MODE_READ_ONLY)
                          val r = PdfRenderer(fd)
                          try {
                              val page = r.openPage(0)
                              val w = 320
                              val h = (w.toFloat() * page.height / page.width).toInt().coerceIn(1, 1200)
                              val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                              bmp.eraseColor(Color.WHITE)
                              page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                              page.close()
                              saveJpeg(bmp, dest)
                          } finally {
                              r.close()
                              fd.close()
                          }
                          return true
                      }
                      "audioArt" -> {
                          val mmr = MediaMetadataRetriever()
                          try {
                              mmr.setDataSource(src)
                              val pic = mmr.embeddedPicture ?: return false
                              File(dest).writeBytes(pic)
                              return true
                          } finally {
                              mmr.release()
                          }
                      }
                      "duration" -> {
                          val mmr = MediaMetadataRetriever()
                          try {
                              mmr.setDataSource(src)
                              return mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                          } finally {
                              mmr.release()
                          }
                      }
                  }
                  return false
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  storage = StorageBridge(this, flutterEngine.dartExecutor.binaryMessenger)
                  archives = ArchiveBridge(this, flutterEngine.dartExecutor.binaryMessenger)
                  media = MediaBridge(this, flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "fm/native").setMethodCallHandler { call, result ->
                      val method = call.method
                      if (method == "vaultScreen") {
                          if (call.argument<String>("src") == "1") {
                              window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                          } else {
                              window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                          }
                          result.success(null)
                          return@setMethodCallHandler
                      }
                  if (method == "keepOn") {
                      if (call.argument<String>("src") == "1") window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      else window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      result.success(true)
                      return@setMethodCallHandler
                  }
                      val src = call.argument<String>("src")
                      val dest = call.argument<String>("dest")
                      val known = setOf("apkIcon", "imageThumb", "videoThumb", "pdfThumb", "audioArt", "duration", "documentThumb", "documentDuration")
                      if (src == null || dest == null || !known.contains(method)) {
                          result.notImplemented()
                      } else {
                          Thread {
                              val res: Any = try {
                                  work(method, src, dest)
                              } catch (e: Throwable) {
                                  if (method == "duration" || method == "documentDuration") 0L else false
                              }
                              runOnUiThread { result.success(res) }
                          }.start()
                      }
                  }
              }
          }
          EOF
          R=android/app/src/main/res
          mkdir -p $R/mipmap-anydpi-v26 $R/drawable
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_fm_bg"/>
              <foreground android:drawable="@drawable/ic_fm_fg"/>
          </adaptive-icon>
          EOF
          cat > $R/drawable/ic_fm_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2F6FE0" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat > $R/drawable/ic_fm_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#F2A300" android:pathData="M30,36h17l6,6h25a4,4 0,0 1,4 4v26a4,4 0,0 1,-4 4H30a4,4 0,0 1,-4 -4V40a4,4 0,0 1,4 -4z"/>
              <path android:fillColor="#FFD24A" android:pathData="M30,48h48a4,4 0,0 1,4 4v20a4,4 0,0 1,-4 4H30a4,4 0,0 1,-4 -4V52a4,4 0,0 1,4 -4z"/>
              <group android:translateX="15.5" android:translateY="18">
                  <path android:fillColor="#2F6FE0" android:pathData="M28,34h5v20h-5v-13.5l-4,2.5v-5z"/>
                  <path android:fillColor="#2F6FE0" android:fillType="evenOdd" android:pathData="M45,34h5v12h3v4.5h-3v3.5h-5v-3.5h-10v-4z M45,40.5v5.5h-4.6z"/>
              </group>
          </vector>
          EOF
      - name: Phan tich va kiem thu
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test
          flutter test
      - name: Build APK
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build.log
          flutter build apk --release --build-name="$APP_VERSION" --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }} 2>&1 | tee -a build.log
      - name: Tom tat loi
        if: failure()
        run: |
          touch build.log
          {
            echo '### Loi build'
            echo '```'
            grep -n -i -E "error|FAILURE|What went wrong|Exception|version solving" -A 6 build.log | head -n 120 || true
            echo '----- 60 dong cuoi -----'
            tail -n 60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ky APK bang khoa rieng
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$KS_B64" ]; then
            echo "### Chua co khoa ky rieng: APK van ky bang khoa debug" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > /tmp/release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks /tmp/release.jks --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out /tmp/signed.apk "$APK"
          "$BT/apksigner" verify --print-certs /tmp/signed.apk | head -3
          mv /tmp/signed.apk "$APK"
          rm -f /tmp/release.jks
          echo "### APK da ky bang khoa rieng ($KS_ALIAS)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk


  media-smoke:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.android_media_smoke || inputs.android_toolkit_smoke) && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.media_smoke_apk_run != '')) }}
    needs: build
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: smoke-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.media_smoke_apk_run || github.run_id }}
      - name: Enable KVM for the Android emulator
        run: |
          printf 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"\n' | sudo tee /etc/udev/rules.d/99-kvm-emulator.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare test fixture encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/media-fixtures"
            "$RUNNER_TEMP/media-fixtures/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: imageio-ffmpeg==0.6.0
            echo "$RUNNER_TEMP/media-fixtures/bin" >> "$GITHUB_PATH"
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          FM_SMOKE_APK: smoke-apk/app-release.apk
          FM_MEDIA_SMOKE: ${{ inputs.android_media_smoke }}
          FM_TOOLKIT_SMOKE: ${{ inputs.android_toolkit_smoke }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -e
            if [ "$FM_TOOLKIT_SMOKE" = "true" ]; then python3 -u test/android/toolkit_smoke.py; fi
            if [ "$FM_MEDIA_SMOKE" = "true" ]; then python3 -u test/android/media_smoke.py; fi
