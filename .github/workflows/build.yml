name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tao khung Android
        run: |
          mkdir -p /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=android --org com.fmdemo --project-name file_manager .
          rm -rf lib test
          cp -r /tmp/keep/lib . && cp /tmp/keep/pubspec.yaml .
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/><application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="Quản lý tập tin"#' $M
          cat $M
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
